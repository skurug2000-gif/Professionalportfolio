<svg viewBox="0 0 940 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="700" fill="#FAFAF8"/>

  <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0d1b34">Where Human Bias Enters an ML Classifier — and the Gate That Catches It</text>
  <text x="470" y="60" text-anchor="middle" font-size="12.5" fill="#5b6472">Five review gates applied to an LLM-based classifier labeling documents as PHI / Non-PHI in a regulated health environment</text>

  <!-- Column headers -->
  <text x="40" y="96" font-size="11" font-weight="700" fill="#2f5fd6" letter-spacing="0.08em">LIFECYCLE STAGE</text>
  <text x="266" y="96" font-size="11" font-weight="700" fill="#b4472e" letter-spacing="0.08em">HUMAN BIAS THAT ENTERS HERE</text>
  <text x="586" y="96" font-size="11" font-weight="700" fill="#2f6b45" letter-spacing="0.08em">GATE / EVIDENCE REQUIRED TO PASS</text>
  <line x1="40" y1="104" x2="900" y2="104" stroke="#c9cfda" stroke-width="1"/>

  <!-- ROW 1 -->
  <g>
    <rect x="40" y="118" width="206" height="96" rx="8" fill="#eaf0ff" stroke="#2f5fd6" stroke-width="1.5"/>
    <text x="56" y="146" font-size="13" font-weight="700" fill="#0d1b34">1. Data selection</text>
    <text x="56" y="167" font-size="11.5" fill="#5b6472">Choosing which documents</text>
    <text x="56" y="183" font-size="11.5" fill="#5b6472">train and tune the model</text>
    <rect x="266" y="118" width="300" height="96" rx="8" fill="#fdeee9" stroke="#d1855f" stroke-width="1.2"/>
    <text x="282" y="145" font-size="12" fill="#22303C">Sampling bias. The corpus gets drawn</text>
    <text x="282" y="163" font-size="12" fill="#22303C">from the document types I already knew</text>
    <text x="282" y="181" font-size="12" fill="#22303C">existed, so unfamiliar sources are absent</text>
    <text x="282" y="199" font-size="12" fill="#22303C">from training and from testing.</text>
    <rect x="586" y="118" width="314" height="96" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.2"/>
    <text x="602" y="145" font-size="12" fill="#22303C">Enumerate the full population before</text>
    <text x="602" y="163" font-size="12" fill="#22303C">sampling from it. Written record of what</text>
    <text x="602" y="181" font-size="12" fill="#22303C">was excluded and on what grounds —</text>
    <text x="602" y="199" font-size="12" fill="#22303C">silent exclusions are the failure mode.</text>
  </g>

  <!-- ROW 2 -->
  <g>
    <rect x="40" y="228" width="206" height="96" rx="8" fill="#eaf0ff" stroke="#2f5fd6" stroke-width="1.5"/>
    <text x="56" y="256" font-size="13" font-weight="700" fill="#0d1b34">2. Labeling</text>
    <text x="56" y="277" font-size="11.5" fill="#5b6472">Defining ground truth for</text>
    <text x="56" y="293" font-size="11.5" fill="#5b6472">what counts as PHI</text>
    <rect x="266" y="228" width="300" height="96" rx="8" fill="#fdeee9" stroke="#d1855f" stroke-width="1.2"/>
    <text x="282" y="255" font-size="12" fill="#22303C">Annotator bias. One person's mental</text>
    <text x="282" y="273" font-size="12" fill="#22303C">model of "what PHI looks like" quietly</text>
    <text x="282" y="291" font-size="12" fill="#22303C">becomes the standard the model is</text>
    <text x="282" y="309" font-size="12" fill="#22303C">measured against.</text>
    <rect x="586" y="228" width="314" height="96" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.2"/>
    <text x="602" y="255" font-size="12" fill="#22303C">Two independent labelers on the held-out</text>
    <text x="602" y="273" font-size="12" fill="#22303C">set, with agreement measured and</text>
    <text x="602" y="291" font-size="12" fill="#22303C">reported. Treat each disagreement as a</text>
    <text x="602" y="309" font-size="12" fill="#22303C">definition gap, not a labeler mistake.</text>
  </g>

  <!-- ROW 3 -->
  <g>
    <rect x="40" y="338" width="206" height="96" rx="8" fill="#eaf0ff" stroke="#2f5fd6" stroke-width="1.5"/>
    <text x="56" y="366" font-size="13" font-weight="700" fill="#0d1b34">3. Design &amp; thresholds</text>
    <text x="56" y="387" font-size="11.5" fill="#5b6472">Setting where the model</text>
    <text x="56" y="403" font-size="11.5" fill="#5b6472">commits to an answer</text>
    <rect x="266" y="338" width="300" height="96" rx="8" fill="#fdeee9" stroke="#d1855f" stroke-width="1.2"/>
    <text x="282" y="365" font-size="12" fill="#22303C">Symmetric-error assumption. Treating a</text>
    <text x="282" y="383" font-size="12" fill="#22303C">missed PHI file and an over-flagged file</text>
    <text x="282" y="401" font-size="12" fill="#22303C">as equally costly, because the metric</text>
    <text x="282" y="419" font-size="12" fill="#22303C">scores them identically.</text>
    <rect x="586" y="338" width="314" height="96" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.2"/>
    <text x="602" y="365" font-size="12" fill="#22303C">Cost-weighted threshold tuned for recall</text>
    <text x="602" y="383" font-size="12" fill="#22303C">on the PHI class. Low-confidence items</text>
    <text x="602" y="401" font-size="12" fill="#22303C">route to human review rather than being</text>
    <text x="602" y="419" font-size="12" fill="#22303C">forced into a label.</text>
  </g>

  <!-- ROW 4 -->
  <g>
    <rect x="40" y="448" width="206" height="96" rx="8" fill="#eaf0ff" stroke="#2f5fd6" stroke-width="1.5"/>
    <text x="56" y="476" font-size="13" font-weight="700" fill="#0d1b34">4. Testing</text>
    <text x="56" y="497" font-size="11.5" fill="#5b6472">Deciding whether the</text>
    <text x="56" y="513" font-size="11.5" fill="#5b6472">model is good enough</text>
    <rect x="266" y="448" width="300" height="96" rx="8" fill="#fdeee9" stroke="#d1855f" stroke-width="1.2"/>
    <text x="282" y="475" font-size="12" fill="#22303C">Confirmation bias. A single aggregate</text>
    <text x="282" y="493" font-size="12" fill="#22303C">accuracy number is easy to accept and</text>
    <text x="282" y="511" font-size="12" fill="#22303C">hides whole segments where the model</text>
    <text x="282" y="529" font-size="12" fill="#22303C">performs badly.</text>
    <rect x="586" y="448" width="314" height="96" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.2"/>
    <text x="602" y="475" font-size="12" fill="#22303C">Metrics broken out by document type,</text>
    <text x="602" y="493" font-size="12" fill="#22303C">language, and owning team. The false-</text>
    <text x="602" y="511" font-size="12" fill="#22303C">negative set is sampled and read by a</text>
    <text x="602" y="529" font-size="12" fill="#22303C">human on purpose, not incidentally.</text>
  </g>

  <!-- ROW 5 -->
  <g>
    <rect x="40" y="558" width="206" height="96" rx="8" fill="#eaf0ff" stroke="#2f5fd6" stroke-width="1.5"/>
    <text x="56" y="586" font-size="13" font-weight="700" fill="#0d1b34">5. Interpretation</text>
    <text x="56" y="607" font-size="11.5" fill="#5b6472">How people read and act</text>
    <text x="56" y="623" font-size="11.5" fill="#5b6472">on the model's output</text>
    <rect x="266" y="558" width="300" height="96" rx="8" fill="#fdeee9" stroke="#d1855f" stroke-width="1.2"/>
    <text x="282" y="585" font-size="12" fill="#22303C">Automation bias. A machine-generated</text>
    <text x="282" y="603" font-size="12" fill="#22303C">label gets read as a verified fact, and the</text>
    <text x="282" y="621" font-size="12" fill="#22303C">classification stops being questioned by</text>
    <text x="282" y="639" font-size="12" fill="#22303C">anyone downstream.</text>
    <rect x="586" y="558" width="314" height="96" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.2"/>
    <text x="602" y="585" font-size="12" fill="#22303C">Confidence shown with every label, an</text>
    <text x="602" y="603" font-size="12" fill="#22303C">explicit "uncertain" output allowed, and a</text>
    <text x="602" y="621" font-size="12" fill="#22303C">standing channel for anyone to report a</text>
    <text x="602" y="639" font-size="12" fill="#22303C">wrong label after launch.</text>
  </g>

  <text x="40" y="678" font-size="11" fill="#8b93a3">Stages follow the five human entry points for bias in AI systems: data selection, labeling, algorithm design, testing and evaluation, and interpretation of results.</text>
</svg>
