<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="500" fill="#FAFAF8"/>

  <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#0d1b34">Two Errors, One Accuracy Score</text>
  <text x="470" y="60" text-anchor="middle" font-size="12.5" fill="#5b6472">A classifier that mislabels a patient record and one that over-restricts a marketing deck score the same. They are not the same.</text>

  <!-- Column headers (model output) -->
  <text x="470" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#2f5fd6" letter-spacing="0.08em">WHAT THE MODEL SAID</text>
  <text x="405" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1b34">Labeled PHI</text>
  <text x="705" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1b34">Labeled Non-PHI</text>

  <!-- Row headers (truth) -->
  <text x="150" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#2f5fd6" letter-spacing="0.08em">GROUND TRUTH</text>
  <text x="150" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1b34">Actually PHI</text>
  <text x="150" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1b34">Actually Non-PHI</text>

  <!-- Quadrant: PHI / labeled PHI -->
  <rect x="260" y="136" width="290" height="112" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.4"/>
  <text x="278" y="162" font-size="11" font-weight="700" fill="#2f6b45" letter-spacing="0.06em">CORRECT</text>
  <text x="278" y="186" font-size="12" fill="#22303C">Regulated data is labeled, access</text>
  <text x="278" y="204" font-size="12" fill="#22303C">controls apply, audit trail intact.</text>
  <text x="278" y="228" font-size="12" font-style="italic" fill="#5b6472">Cost: none.</text>

  <!-- Quadrant: PHI / labeled Non-PHI  (FALSE NEGATIVE - emphasized) -->
  <rect x="560" y="136" width="340" height="112" rx="8" fill="#fbe3dd" stroke="#b4472e" stroke-width="2.5"/>
  <text x="578" y="162" font-size="11" font-weight="700" fill="#b4472e" letter-spacing="0.06em">FALSE NEGATIVE — THE EXPENSIVE ONE</text>
  <text x="578" y="186" font-size="12" fill="#22303C">Patient data sits in an unrestricted location</text>
  <text x="578" y="204" font-size="12" fill="#22303C">with nothing flagging it. Nobody notices.</text>
  <text x="578" y="228" font-size="12" font-weight="700" fill="#b4472e">Cost: regulatory exposure, potential breach.</text>

  <!-- Quadrant: Non-PHI / labeled PHI (FALSE POSITIVE) -->
  <rect x="260" y="264" width="290" height="112" rx="8" fill="#fdf3e0" stroke="#c99a2e" stroke-width="1.4"/>
  <text x="278" y="290" font-size="11" font-weight="700" fill="#9a7420" letter-spacing="0.06em">FALSE POSITIVE</text>
  <text x="278" y="314" font-size="12" fill="#22303C">A harmless file is over-restricted.</text>
  <text x="278" y="332" font-size="12" fill="#22303C">Someone files an access request.</text>
  <text x="278" y="356" font-size="12" font-style="italic" fill="#5b6472">Cost: friction, recoverable in minutes.</text>

  <!-- Quadrant: Non-PHI / labeled Non-PHI -->
  <rect x="560" y="264" width="340" height="112" rx="8" fill="#e7f2ea" stroke="#4A8F5C" stroke-width="1.4"/>
  <text x="578" y="290" font-size="11" font-weight="700" fill="#2f6b45" letter-spacing="0.06em">CORRECT</text>
  <text x="578" y="314" font-size="12" fill="#22303C">Ordinary business content stays</text>
  <text x="578" y="332" font-size="12" fill="#22303C">accessible to the people who need it.</text>
  <text x="578" y="356" font-size="12" font-style="italic" fill="#5b6472">Cost: none.</text>

  <!-- Takeaway bar -->
  <rect x="150" y="406" width="750" height="66" rx="8" fill="#eaf0ff" stroke="#2f5fd6" stroke-width="1.2"/>
  <text x="172" y="432" font-size="12.5" font-weight="700" fill="#0d1b34">Implication for evaluation:</text>
  <text x="172" y="452" font-size="12.5" fill="#22303C">optimize and report recall on the PHI class rather than overall accuracy, and read a sample of the false-negative</text>
  <text x="172" y="466" font-size="12.5" fill="#22303C">set by hand before approving the system. An aggregate metric will average away the only error that actually matters.</text>
</svg>
