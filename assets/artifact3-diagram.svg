<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="560" fill="#FAFAF8"/>

  <text x="470" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#22303C">How a Neural Network "Thinks" (like a new hire learning the job)</text>

  <!-- Column headers -->
  <text x="140" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#3B6EA5">INPUT LAYER</text>
  <text x="140" y="103" text-anchor="middle" font-size="12" fill="#5A6B78">information coming in</text>

  <text x="470" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#3B6EA5">HIDDEN LAYER</text>
  <text x="470" y="103" text-anchor="middle" font-size="12" fill="#5A6B78">weighing the factors</text>

  <text x="800" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#3B6EA5">OUTPUT LAYER</text>
  <text x="800" y="103" text-anchor="middle" font-size="12" fill="#5A6B78">making the call</text>

  <!-- Input nodes -->
  <g id="inputs">
    <rect x="60" y="150" width="160" height="46" rx="8" fill="#D8E7F5" stroke="#3B6EA5" stroke-width="1.5"/>
    <text x="140" y="178" text-anchor="middle" font-size="13" fill="#22303C">New info arrives</text>

    <rect x="60" y="230" width="160" height="46" rx="8" fill="#D8E7F5" stroke="#3B6EA5" stroke-width="1.5"/>
    <text x="140" y="258" text-anchor="middle" font-size="13" fill="#22303C">Situation details</text>

    <rect x="60" y="310" width="160" height="46" rx="8" fill="#D8E7F5" stroke="#3B6EA5" stroke-width="1.5"/>
    <text x="140" y="338" text-anchor="middle" font-size="13" fill="#22303C">Context clues</text>

    <rect x="60" y="390" width="160" height="46" rx="8" fill="#D8E7F5" stroke="#3B6EA5" stroke-width="1.5"/>
    <text x="140" y="418" text-anchor="middle" font-size="13" fill="#22303C">Past experience</text>
  </g>

  <!-- Hidden nodes (circles) -->
  <g id="hidden">
    <circle cx="470" cy="180" r="34" fill="#FCE9DE" stroke="#D9773F" stroke-width="1.5"/>
    <circle cx="470" cy="270" r="34" fill="#FCE9DE" stroke="#D9773F" stroke-width="1.5"/>
    <circle cx="470" cy="360" r="34" fill="#FCE9DE" stroke="#D9773F" stroke-width="1.5"/>
    <text x="470" y="440" text-anchor="middle" font-size="12" fill="#5A6B78">each circle: a "judgment call" node</text>
  </g>

  <!-- Output nodes -->
  <g id="outputs">
    <rect x="720" y="200" width="160" height="46" rx="8" fill="#E1F0E4" stroke="#4A8F5C" stroke-width="1.5"/>
    <text x="800" y="228" text-anchor="middle" font-size="13" fill="#22303C">Decision: Approve</text>

    <rect x="720" y="300" width="160" height="46" rx="8" fill="#E1F0E4" stroke="#4A8F5C" stroke-width="1.5"/>
    <text x="800" y="328" text-anchor="middle" font-size="13" fill="#22303C">Decision: Flag it</text>
  </g>

  <!-- Connections input -> hidden (representative, not all-to-all, for clarity) -->
  <g stroke="#B7C4CE" stroke-width="1.3" fill="none">
    <line x1="220" y1="173" x2="436" y2="180"/>
    <line x1="220" y1="173" x2="436" y2="270"/>
    <line x1="220" y1="253" x2="436" y2="180"/>
    <line x1="220" y1="253" x2="436" y2="270"/>
    <line x1="220" y1="253" x2="436" y2="360"/>
    <line x1="220" y1="333" x2="436" y2="270"/>
    <line x1="220" y1="333" x2="436" y2="360"/>
    <line x1="220" y1="413" x2="436" y2="270"/>
    <line x1="220" y1="413" x2="436" y2="360"/>
  </g>

  <!-- Connections hidden -> output -->
  <g stroke="#B7C4CE" stroke-width="1.3" fill="none">
    <line x1="504" y1="180" x2="720" y2="223"/>
    <line x1="504" y1="270" x2="720" y2="223"/>
    <line x1="504" y1="270" x2="720" y2="323"/>
    <line x1="504" y1="360" x2="720" y2="323"/>
  </g>

  <!-- Feedback loop -->
  <path d="M 800 350 C 800 480, 470 500, 470 410" stroke="#D9773F" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="640" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#D9773F">Feedback / coaching = "training"</text>
  <text x="640" y="518" text-anchor="middle" font-size="11" fill="#8A6650">(this is what adjusts the weights next time)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D9773F"/>
    </marker>
  </defs>
</svg>
